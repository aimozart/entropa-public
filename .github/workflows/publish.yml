name: Publish to crates.io

# Manually-triggered, Trusted Publishing (OIDC) — no long-lived crates.io token stored
# anywhere. Only entropa-core / entropa-node are published; entropa-agents is proprietary
# and entropa-api depends on it, so neither is ever published from this workflow.

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to publish"
        required: true
        type: choice
        options:
          - core
          - node

permissions:
  id-token: write

jobs:
  publish:
    name: cargo publish (entropa-${{ inputs.crate }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (crate being published)
        run: cargo test --package entropa-${{ inputs.crate }} --verbose
      - name: Get crates.io token (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: cargo publish
        run: cargo publish --package entropa-${{ inputs.crate }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
