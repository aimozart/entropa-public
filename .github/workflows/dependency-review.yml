name: Dependency review

# Supply-chain gate on pull requests: fails the PR if it adds a dependency
# with a known vulnerability of moderate severity or higher, before it can
# reach main.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
