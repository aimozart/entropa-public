server:
  port: 8082

spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: transparency-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.entropa.*"
        spring.json.type.mapping: "attestation-event:com.entropa.transparencyservice.model.AttestationEvent"
  data:
    mongodb:
      auto-index-creation: true   # create the @Indexed indexes when the app starts
      # no uri here, on purpose: the connection string holds a password, so it arrives only
      # as the environment variable SPRING_DATA_MONGODB_URI (rule L2)

entropa:
  ingest:
    topic: entropa.attestations
