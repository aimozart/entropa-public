# Entropa (public) — post-quantum core, Proof of Entropy consensus, and the Scryon
# explorer. "AI probes reach post-quantum consensus, seeded by the entropy of space."
#
# The AI Probe intelligence (entropa-agents) is proprietary and lives in a private
# repo — see OPEN_SOURCE.md. This public repo is the open-core: crypto + consensus +
# explorer, all MIT-licensed.
[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/node",
    "crates/api",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
authors = ["aimozart <aimozart@entropa.space>"]
license = "MIT"
repository = "https://github.com/aimozart/entropa-public"

[workspace.dependencies]
blake3 = "1"
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
