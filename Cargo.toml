# Early Entropa crates, published to crates.io: entropa-core and entropa-node.
[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/node",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
authors = ["aimozart <aimozart@entropa.space>"]
license = "MIT"
repository = "https://github.com/aimozart/entropa-public"

[workspace.dependencies]
blake3 = "1"
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
